name: Develop - Build & Docker

on:
  pull_request:
    branches:
      - 'develop'
      - 'main'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots verify

      - name: Copy jar to staging
        run: mkdir staging && cp target/*.jar staging

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: Package
          path: staging
          if-no-files-found: error
          retention-days: 7

  build_docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download jar
        uses: actions/download-artifact@v8
        with:
          name: Package
          path: target

      - name: Set lower case repo name & tag
        run: |
          echo "GH_REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "TAG_NAME=$(echo "$REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's|/|-|g')" >> "$GITHUB_ENV"
        env:
          REF_NAME: ${{ github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ env.GH_REPO_LC }}:${{ env.TAG_NAME }}
