name: Develop - Build & Docker

on:
  pull_request:
    branches:
      - 'develop'
      - 'main'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout of code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots verify

      - name: Copy jar to staging
        run: mkdir staging && cp target/*.jar staging

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: Package
          path: staging
          if-no-files-found: error
          retention-days: 7

  build_docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download jar
        uses: actions/download-artifact@v8
        with:
          name: Package
          path: target

      - name: Set lower case repo name & tag
        run: |
          echo "GH_REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "TAG_NAME=$(echo "$REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's|/|-|g')" >> "$GITHUB_ENV"
        env:
          REF_NAME: ${{ github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ env.GH_REPO_LC }}:${{ env.TAG_NAME }}

  secure_scan:
    runs-on: ubuntu-latest
    needs: build_docker
    steps:

      - name: Set lower case Github repository name
        run: |
          echo "GH_REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Prepare Image tag name
        run: |
          # Extracting the substring after "refs/heads/"
          BRANCH_NAME=${REF_NAME#refs/heads/}

          # Converting to lower case and replacing '/' with '-'
          BRANCH_NAME_LOWERCASE=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's|/|-|g')

          # Creating new enviornment variable
          echo "TAG_NAME=${BRANCH_NAME_LOWERCASE}" >> ${GITHUB_ENV}

        env:
          REF_NAME: ${{ github.ref_name }}
      - name: Trivy image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ env.GH_REPO_LC }}:${{ env.TAG_NAME }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  code_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Resolve Maven dependencies
        run: mvn --batch-mode dependency:resolve

      - name: Trivy Code Scaning
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
